# Local quality gates for agents and humans. Install once:
#   uv run pre-commit install
# Run on all files:
#   uv run pre-commit run --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: '\.md$'

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      # Override the default `--staged` entry so `pre-commit run --all-files`
      # (and normal commits) audit the working tree, not every local ref in a
      # shared git directory. Full git history is scanned in CI
      # (`.github/workflows/secret-scan.yml`).
      - id: gitleaks
        entry: gitleaks detect --source . --no-git --verbose --redact
        pass_filenames: false

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
        args: [app]
