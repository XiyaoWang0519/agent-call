app = 'agent-call'
primary_region = 'lax'

[build]

[env]
  ALLOWED_COUNTRY_CODES = '["+1"]'
  ASK_AGENT_ENABLED = 'true'
  DATABASE_URL = 'sqlite:////data/agent_call.db'
  PUBLIC_BASE_URL = 'https://agent-call.fly.dev'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = '20s'
    interval = '30s'
    method = 'GET'
    path = '/healthz'
    timeout = '5s'

[mounts]
  source = 'agent_call_data'
  destination = '/data'
  initial_size = '1gb'
  snapshot_retention = 5

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
