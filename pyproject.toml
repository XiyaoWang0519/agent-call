[project]
name = "agent-call"
version = "0.1.0"
description = "Self-hosted single-owner MCP bridge for outbound phone calls via OpenAI Realtime SIP and Twilio"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "XiyaoWang0519" }]
keywords = [
    "mcp",
    "openai-realtime",
    "twilio",
    "voice-agent",
    "fastapi",
    "sip",
    "ai-agents",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Telephony",
    "Typing :: Typed",
]
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.141.1",
    "fastmcp>=3.4.5",
    "httpx>=0.28.1",
    "openai>=2.51.0",
    "phonenumbers>=9.0.35",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.32",
    "twilio>=9.10.9",
    "uvicorn>=0.52.0",
    "websockets>=17.0.1",
]

[project.urls]
Homepage = "https://github.com/XiyaoWang0519/agent-call"
Repository = "https://github.com/XiyaoWang0519/agent-call"
Issues = "https://github.com/XiyaoWang0519/agent-call/issues"
Documentation = "https://github.com/XiyaoWang0519/agent-call/blob/main/README.md"
Changelog = "https://github.com/XiyaoWang0519/agent-call/blob/main/CHANGELOG.md"
Security = "https://github.com/XiyaoWang0519/agent-call/blob/main/SECURITY.md"

[dependency-groups]
dev = [
    "mypy>=1.17.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.1",
    "types-protobuf>=6.30.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
# Gates regressions in CI (`pytest --cov=app`) without affecting plain
# `uv run pytest`, which doesn't load coverage at all.
fail_under = 85
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "FIX"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unreachable = true
show_error_codes = true
packages = ["app"]
exclude = [
    "tests/",
    "scripts/",
    "dist/",
]

# Third-party packages without complete stubs.
[[tool.mypy.overrides]]
module = [
    "twilio.*",
    "phonenumbers.*",
    "fastmcp.*",
    "aiosqlite.*",
]
ignore_missing_imports = true
