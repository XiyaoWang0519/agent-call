[project]
name = "poke-call"
version = "0.1.0"
description = "Single-user Poke outbound phone-call bridge"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.139.0",
    "fastmcp>=3.4.4",
    "httpx>=0.28.1",
    "openai>=2.45.0",
    "phonenumbers>=9.0.34",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.32",
    "twilio>=9.10.9",
    "uvicorn>=0.51.0",
    "websockets>=16.1",
]

[dependency-groups]
dev = [
    "mypy>=1.17.0",
    "pre-commit>=4.2.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.15.21",
    "types-protobuf>=6.30.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unreachable = true
show_error_codes = true
packages = ["app"]
exclude = [
    "tests/",
    "scripts/",
    "dist/",
]

# Third-party packages without complete stubs.
[[tool.mypy.overrides]]
module = [
    "twilio.*",
    "phonenumbers.*",
    "fastmcp.*",
    "aiosqlite.*",
]
ignore_missing_imports = true
