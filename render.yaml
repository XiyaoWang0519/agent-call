services:
  - type: web
    name: poke-call
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    autoDeployTrigger: off
    disk:
      name: poke-call-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////var/data/poke_call.db
      - key: ALLOWED_COUNTRY_CODES
        value: +1
      - key: INPUT_TRANSCRIPTION_MODEL
        value: grok-transcribe
      - key: REALTIME_MODEL
        value: grok-voice-think-fast-1.0
      - key: EXTRACTOR_MODEL
        value: grok-4.3
      - key: POKE_PUSH_ENABLED
        value: "false"
      - key: XAI_API_KEY
        sync: false
      - key: XAI_WEBHOOK_SECRET
        sync: false
      - key: XAI_SIP_PHONE_NUMBER
        sync: false
      - key: XAI_SIP_AUTH_USERNAME
        sync: false
      - key: XAI_SIP_AUTH_PASSWORD
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_CALLER_ID
        sync: false
      - key: OWNER_PHONE_E164
        sync: false
      - key: ALLOWED_POKE_USER_ID
        sync: false
      - key: MCP_BEARER_TOKEN
        sync: false
      - key: DEBUG_API_TOKEN
        sync: false
      - key: DEPLOY_GUARD_TOKEN
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
