services:
  - type: web
    name: YOUR_RENDER_SERVICE_NAME
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    autoDeployTrigger: off
    disk:
      name: YOUR_RENDER_DISK_NAME
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////var/data/agent_call.db
      - key: INPUT_TRANSCRIPTION_MODEL
        value: gpt-realtime-whisper
      - key: EXTRACTOR_MODEL
        value: gpt-5.4-nano-2026-03-17
      - key: MINI_MODELS_ENABLED
        value: "false"
      - key: AGENT_PUSH_ENABLED
        value: "false"
      - key: ASK_AGENT_ENABLED
        value: "false"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_WEBHOOK_SECRET
        sync: false
      - key: OPENAI_PROJECT_ID
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_CALLER_ID
        sync: false
      - key: OWNER_PHONE_E164
        sync: false
      - key: ALLOWED_AGENT_USER_ID
        sync: false
      - key: MCP_BEARER_TOKEN
        sync: false
      - key: DEBUG_API_TOKEN
        sync: false
      - key: DEPLOY_GUARD_TOKEN
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: AGENT_WEBHOOK_URL
        sync: false
      - key: AGENT_WEBHOOK_TOKEN
        sync: false
